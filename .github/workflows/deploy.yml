name: Сборка и деплой на VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_moodle_rebuild:
        description: 'Принудительно пересобрать образ Moodle'
        type: boolean
        default: false

env:
  MOODLE_VERSION: '5.1.2'   # ← менять здесь при обновлении версии Moodle

jobs:
  # Определяем какие папки изменились чтобы не собирать лишнее
  changes:
    runs-on: ubuntu-latest
    outputs:
      moodle:  ${{ steps.filter.outputs.moodle }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            moodle:
              - 'moodle/**'
            backend:
              - 'backend/**'

  # Сборка и push backend-образа на Docker Hub
  # Запускается только если изменились файлы в backend/
  build-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Сборка и push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/geocore-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/geocore-backend:${{ github.sha }}

  # Сборка и push Moodle-образа на Docker Hub
  # Запускается только если изменились файлы в moodle/ или вручную
  # Внимание: git clone Moodle занимает ~5 мин в CI
  build-moodle:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.moodle == 'true' || github.event.inputs.force_moodle_rebuild == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Сборка и push Moodle
        uses: docker/build-push-action@v5
        with:
          context: ./moodle
          push: true
          build-args: MOODLE_VERSION=${{ env.MOODLE_VERSION }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/geocore-moodle:${{ env.MOODLE_VERSION }}

  # Деплой на VPS через SSH
  # Запускается всегда после build-шагов (даже если они были пропущены)
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-moodle]
    if: always() && !failure() && !cancelled()
    steps:
      - name: Деплой на VPS через SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/geocore
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "==> Задеплоено: $(date)"
