name: Сборка и деплой на VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_moodle_rebuild:
        description: 'Принудительно пересобрать образ Moodle'
        type: boolean
        default: false

env:
  MOODLE_VERSION: '5.1.4'   # ← менять здесь при обновлении версии Moodle

jobs:
  # Валидация: синтаксис Python + JSON
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Синтакс-чек backend/main.py
        run: |
          python3 -c "
          import ast, sys
          with open('backend/main.py') as f:
              source = f.read()
          try:
              ast.parse(source)
              print('✓ backend/main.py синтаксис OK')
          except SyntaxError as e:
              print(f'✗ SyntaxError в backend/main.py: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Валидация site.json
        run: |
          python3 -c "
          import json, sys
          try:
              with open('frontend/js/data/site.json') as f:
                  json.load(f)
              print('✓ site.json валидный')
          except json.JSONDecodeError as e:
              print(f'✗ site.json невалидный: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Валидация docker-compose.yml
        run: docker compose --env-file .env.example config --quiet

  # Pytest для backend
  test-backend:
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установка зависимостей
        run: pip install -r backend/requirements.txt
      - name: Запуск тестов
        working-directory: backend
        env:
          ADMIN_TOKEN: test-secret-token
          ADMIN_USERNAME: testadmin
        run: pytest -v

  # Определяем какие папки изменились чтобы не собирать лишнее
  changes:
    runs-on: ubuntu-latest
    outputs:
      moodle:    ${{ steps.filter.outputs.moodle }}
      backend:   ${{ steps.filter.outputs.backend }}
      frontend:  ${{ steps.filter.outputs.frontend }}
      infra:     ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            moodle:
              - 'moodle/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - 'nginx/**'
              - '.github/workflows/deploy.yml'
            infra:
              - 'docker-compose.yml'
              - 'docker-compose.test.yml'
              - '.env.example'
              - 'nginx/**'
              - 'bot/**'
              - 'backup/**'
              - 'scripts/**'
              - '.github/workflows/deploy.yml'

  # Сборка и push backend-образа на Docker Hub
  # Запускается только если изменились файлы в backend/
  build-backend:
    runs-on: ubuntu-latest
    needs: [validate, changes, test-backend]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Сборка и push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/geocore-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/geocore-backend:${{ github.sha }}

  # Сборка и push frontend-образа на Docker Hub
  build-frontend:
    runs-on: ubuntu-latest
    needs: [validate, changes]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Сборка и push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/geocore-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/geocore-frontend:${{ github.sha }}

  # Сборка и push Moodle-образа на Docker Hub
  # Запускается только если изменились файлы в moodle/ или вручную
  # Внимание: git clone Moodle занимает ~5 мин в CI
  build-moodle:
    runs-on: ubuntu-latest
    needs: [validate, changes]
    if: needs.changes.outputs.moodle == 'true' || github.event.inputs.force_moodle_rebuild == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Сборка и push Moodle
        uses: docker/build-push-action@v5
        with:
          context: ./moodle
          push: true
          no-cache: true
          build-args: MOODLE_VERSION=${{ env.MOODLE_VERSION }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/geocore-moodle:${{ env.MOODLE_VERSION }}

  # Деплой на VPS через SSH
  # Запускается всегда после build-шагов (даже если они были пропущены)
  deploy:
    runs-on: ubuntu-latest
    needs: [changes, test-backend, build-backend, build-moodle, build-frontend]
    if: |
      always() && !failure() && !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.moodle == 'true' ||
        needs.changes.outputs.infra == 'true'
      )
    steps:
      - name: Деплой на VPS через SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/geocore
            git pull origin main
            sed -i "s/MOODLE_VERSION=.*/MOODLE_VERSION=${{ env.MOODLE_VERSION }}/" /opt/geocore/.env
            docker compose pull
            docker compose up -d frontend backend moodle usn_backend usn_frontend --remove-orphans
            docker compose up -d --build bot backup --remove-orphans
            docker image prune -f
            echo "==> Задеплоено: $(date)"

  # Smoke test — проверяем что сервисы живы после деплоя
  smoke-test:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Ждём поднятия сервисов (30s)
        run: sleep 30

      - name: Проверка backend /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.geocore-academy.ru/health)
          if [ "$STATUS" != "200" ]; then
            echo "✗ Backend вернул $STATUS (ожидали 200)" >&2
            exit 1
          fi
          echo "✓ Backend /health OK ($STATUS)"

      - name: Проверка frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://geocore-academy.ru/)
          if [ "$STATUS" != "200" ]; then
            echo "✗ Frontend вернул $STATUS (ожидали 200)" >&2
            exit 1
          fi
          echo "✓ Frontend OK ($STATUS)"

      - name: Проверка Moodle
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://courses.geocore-academy.ru/login/index.php)
          if [ "$STATUS" != "200" ]; then
            echo "✗ Moodle вернул $STATUS (ожидали 200)" >&2
            exit 1
          fi
          echo "✓ Moodle OK ($STATUS)"

      - name: Проверка USN /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${USN_BASIC_USER}:${USN_BASIC_PASS}" https://usn.geocore-academy.ru/health)
          if [ "$STATUS" != "200" ]; then
            echo "✗ USN health вернул $STATUS (ожидали 200)" >&2
            exit 1
          fi
          echo "✓ USN /health OK ($STATUS)"
        env:
          USN_BASIC_USER: ${{ secrets.USN_BASIC_USER }}
          USN_BASIC_PASS: ${{ secrets.USN_BASIC_PASS }}
