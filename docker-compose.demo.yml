# GeoCore Academy — стек для KZ (становится основным регионом).
# Ядро: mariadb + moodle + frontend + backend + backup.
# НЕ включает bot / usn / watchtower — экономия RAM (4 ГБ бокс).
#
# ВАЖНО про backup: у KZ ОТДЕЛЬНЫЙ бакет (S3_BUCKET в .env). В общий бакет с RU
# писать нельзя — ключи daily/monthly завязаны только на дату, а `s3 sync --delete`
# в moodledata-mirror/ снесёт зеркало другого региона.
# Запуск:  docker compose -f docker-compose.demo.yml up -d
# Volume-имена совпадают с docker-compose.yml (проект geocore) — данные общие.

services:
  mariadb:
    image: mariadb:10.11
    container_name: geocore_db
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MOODLE_DB_NAME}
      MYSQL_USER: ${MOODLE_DB_USER}
      MYSQL_PASSWORD: ${MOODLE_DB_PASSWORD}
    networks:
      - geocore_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  moodle:
    image: andreysagurov/geocore-moodle:${MOODLE_VERSION}
    container_name: geocore_moodle
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - moodle_data:/var/moodledata
    environment:
      MOODLE_DB_HOST: mariadb
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME}
      MOODLE_LANG: ${MOODLE_LANG:-ru}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER}
      MOODLE_ADMIN_PASS: ${MOODLE_ADMIN_PASS}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
    networks:
      - geocore_net

  frontend:
    image: andreysagurov/geocore-frontend:latest
    container_name: geocore_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    environment:
      # Переключает в статике домен целиком: courses.*, api.*, mailto:*
      SITE_DOMAIN: ${SITE_DOMAIN:-geocore-academy.kz}
      # Отдельный override на случай, если почта живёт не на домене сайта.
      # С 19.07.2026 ящик info@geocore-academy.kz заведён в Zoho — заглушка на .ru
      # больше не нужна.
      CONTACT_EMAIL: ${CONTACT_EMAIL:-info@geocore-academy.kz}
    networks:
      - geocore_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    image: andreysagurov/geocore-backend:latest
    container_name: geocore_api
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_static:/app/static
    environment:
      MOODLE_URL: ${MOODLE_WWWROOT:-https://courses.geocore-academy.kz}
      MOODLE_TOKEN: ${MOODLE_TOKEN}
      DB_HOST: mariadb
      DB_NAME: ${MOODLE_DB_NAME}
      DB_USER: ${MOODLE_DB_USER}
      DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-info@geocore-academy.kz}
      CONTACT_SITE: ${CONTACT_SITE:-geocore-academy.kz}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://geocore-academy.kz}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      MAX_CSV_BYTES: ${MAX_CSV_BYTES:-5242880}
      MAX_CSV_ROWS: ${MAX_CSV_ROWS:-20000}
    networks:
      - geocore_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: geocore_backup
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - moodle_data:/moodledata:ro
      - backup_logs:/var/log
    environment:
      DB_HOST: mariadb
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.ru-3.storage.selcloud.ru}
      # ОБЯЗАТЕЛЬНО отдельный бакет от RU — см. шапку файла
      S3_BUCKET: ${S3_BUCKET:?KZ требует СВОЙ бакет, не тот же что у RU}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ru-3}
      # AWS CLI не доверяет цепочке GlobalSign у Selectel (сертификат валиден, не
      # MITM) — без этого s3-операции падают с CERTIFICATE_VERIFY_FAILED.
      # См. MIGRATION_KZ.md, "KZ-специфичные гочи".
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # SOCKS5-туннель нужен был на FirstVDS (блокировка Telegram). На hoster.kz
      # Telegram доступен напрямую — по умолчанию без прокси.
      TELEGRAM_PROXY: ${BACKUP_TELEGRAM_PROXY:-}
    networks:
      - geocore_net

networks:
  geocore_net:
    driver: bridge

volumes:
  mariadb_data:
  moodle_data:
  backend_static:
  backup_logs:
