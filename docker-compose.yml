# Production — использует готовые образы с Docker Hub
# Секреты читаются из .env (не коммитится в git, см. .env.example)

services:
  mariadb:
    image: mariadb:10.11
    container_name: geocore_db
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MOODLE_DB_NAME}
      MYSQL_USER: ${MOODLE_DB_USER}
      MYSQL_PASSWORD: ${MOODLE_DB_PASSWORD}
    networks:
      - geocore_net

  moodle:
    image: andreysagurov/geocore-moodle:${MOODLE_VERSION}
    container_name: geocore_moodle
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - moodle_data:/var/moodledata
    environment:
      MOODLE_DB_HOST: mariadb
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME}
      MOODLE_LANG: ${MOODLE_LANG:-ru}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER}
      MOODLE_ADMIN_PASS: ${MOODLE_ADMIN_PASS}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
    networks:
      - geocore_net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: andreysagurov/geocore-frontend:latest
    container_name: geocore_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - geocore_net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  backend:
    image: andreysagurov/geocore-backend:latest
    container_name: geocore_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MOODLE_URL: ${MOODLE_WWWROOT:-https://courses.geocore-academy.ru}
      MOODLE_TOKEN: ${MOODLE_TOKEN}
      DB_HOST: mariadb
      DB_NAME: ${MOODLE_DB_NAME}
      DB_USER: ${MOODLE_DB_USER}
      DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-Andreyhiitola/geocore}
    networks:
      - geocore_net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: geocore_bot
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/rootfs:ro
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISK_WARN: ${DISK_WARN:-85}
      RAM_WARN: ${RAM_WARN:-90}
      CPU_WARN: ${CPU_WARN:-95}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    networks:
      - geocore_net

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: geocore_backup
    restart: unless-stopped
    volumes:
      - moodle_data:/moodledata:ro
      - backup_logs:/var/log
    environment:
      DB_HOST: mariadb
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.selectel.ru}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ru-1}
      RESTIC_REPOSITORY: s3:${S3_ENDPOINT:-https://s3.selectel.ru}/${S3_BUCKET}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    networks:
      - geocore_net

  watchtower:
    image: containrrr/watchtower
    container_name: geocore_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INTERVAL: "3600"
      DOCKER_API_VERSION: "1.40"
    command: --label-enable
    networks:
      - geocore_net

networks:
  geocore_net:
    driver: bridge

volumes:
  mariadb_data:
  moodle_data:
  backup_logs:
