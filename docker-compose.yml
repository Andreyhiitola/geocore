# Production — использует готовые образы с Docker Hub
# Секреты читаются из .env (не коммитится в git, см. .env.example)
# restart: always — поднимается автоматически после перезагрузки VPS

services:
  mariadb:
    image: mariadb:10.11
    container_name: geocore_db
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MOODLE_DB_NAME}
      MYSQL_USER: ${MOODLE_DB_USER}
      MYSQL_PASSWORD: ${MOODLE_DB_PASSWORD}
    networks:
      - geocore_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  moodle:
    image: andreysagurov/geocore-moodle:${MOODLE_VERSION}
    container_name: geocore_moodle
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - moodle_data:/var/moodledata
    environment:
      MOODLE_DB_HOST: mariadb
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME}
      MOODLE_LANG: ${MOODLE_LANG:-ru}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER}
      MOODLE_ADMIN_PASS: ${MOODLE_ADMIN_PASS}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
    networks:
      - geocore_net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: andreysagurov/geocore-frontend:latest
    container_name: geocore_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - geocore_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  backend:
    image: andreysagurov/geocore-backend:latest
    container_name: geocore_api
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_static:/app/static
    environment:
      MOODLE_URL: ${MOODLE_WWWROOT:-https://courses.geocore-academy.ru}
      MOODLE_TOKEN: ${MOODLE_TOKEN}
      DB_HOST: mariadb
      DB_NAME: ${MOODLE_DB_NAME}
      DB_USER: ${MOODLE_DB_USER}
      DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-Andreyhiitola/geocore}
      USN_API_URL: ${USN_API_URL:-http://geocore_usn_api:5000}
      USN_API_KEY: ${USN_API_KEY:-}
    networks:
      - geocore_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: geocore_bot
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/rootfs:ro
      - /opt/geocore/bot_data:/app/data
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISK_WARN: ${DISK_WARN:-85}
      RAM_WARN: ${RAM_WARN:-90}
      CPU_WARN: ${CPU_WARN:-95}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    networks:
      - geocore_net

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: geocore_backup
    restart: always
    volumes:
      - moodle_data:/moodledata:ro
      - usn_data:/usn_data:ro
      - backup_logs:/var/log
    environment:
      DB_HOST: mariadb
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.ru-3.storage.selcloud.ru}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ru-3}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    networks:
      - geocore_net

  usn_backend:
    image: andreysagurov/usn-backend:latest
    container_name: geocore_usn_api
    restart: always
    ports:
      - "127.0.0.1:3001:5000"
    volumes:
      - usn_data:/app/data
    environment:
      USN_API_KEY: ${USN_API_KEY:-}
      GEOCORE_API_URL: ${GEOCORE_API_URL:-https://api.geocore-academy.ru}
      GEOCORE_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GEOCORE_ADMIN_USER: ${ADMIN_USERNAME:-}
    networks:
      - geocore_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  usn_frontend:
    image: andreysagurov/usn-frontend:latest
    container_name: geocore_usn_front
    restart: always
    ports:
      - "127.0.0.1:3002:80"
    networks:
      - geocore_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: geocore_watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INTERVAL: "3600"
      DOCKER_API_VERSION: "1.40"
    command: --label-enable
    networks:
      - geocore_net

networks:
  geocore_net:
    driver: bridge

volumes:
  mariadb_data:
  moodle_data:
  backup_logs:
  backend_static:
  usn_data:
