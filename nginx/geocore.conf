# GeoCore-Academy — nginx reverse proxy config
# Установить: sudo cp geocore.conf /etc/nginx/sites-available/geocore
#             sudo ln -s /etc/nginx/sites-available/geocore /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name geocore-academy.ru courses.geocore-academy.ru api.geocore-academy.ru usn.geocore-academy.ru usn-api.geocore-academy.ru;
    return 301 https://$host$request_uri;
}

# Frontend (главный домен)
server {
    listen 443 ssl http2;
    server_name geocore-academy.ru;

    ssl_certificate     /etc/letsencrypt/live/courses.geocore-academy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courses.geocore-academy.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Moodle LMS
server {
    listen 443 ssl http2;
    server_name courses.geocore-academy.ru;

    ssl_certificate     /etc/letsencrypt/live/courses.geocore-academy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courses.geocore-academy.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    # Электронные курсы (CourseLab HTML) — отдаются напрямую с диска
    location /content/ {
        alias /opt/geocore/courses/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# Python / FastAPI Backend
server {
    listen 443 ssl http2;
    server_name api.geocore-academy.ru;

    ssl_certificate     /etc/letsencrypt/live/courses.geocore-academy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courses.geocore-academy.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# USN-app frontend
server {
    listen 443 ssl http2;
    server_name usn.geocore-academy.ru;

    ssl_certificate     /etc/letsencrypt/live/courses.geocore-academy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courses.geocore-academy.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Базовая HTTP-авторизация — только для владельца
    auth_basic           "USN App";
    auth_basic_user_file /etc/nginx/.htpasswd_usn;

    location /api/ {
        auth_basic         off;
        proxy_pass         http://127.0.0.1:3001/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        include            /etc/nginx/usn_api_key.conf;
    }

    location /health {
        proxy_pass         http://127.0.0.1:3001/health;
        proxy_set_header   Host              $host;
        auth_basic         off;
    }

    location / {
        proxy_pass       http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# USN-app backend API
server {
    listen 443 ssl http2;
    server_name usn-api.geocore-academy.ru;

    ssl_certificate     /etc/letsencrypt/live/courses.geocore-academy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courses.geocore-academy.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
