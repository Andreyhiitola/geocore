# GeoCore-Academy — nginx reverse proxy config (Казахстан, geocore-academy.kz)
# Копия nginx/geocore.conf с доменами .kz. Порты сервисов те же (127.0.0.1).
#
# Установка на KZ-VPS (nginx на хосте, НЕ в Docker — как на проде):
#   sudo cp nginx/geocore-kz.conf /etc/nginx/sites-enabled/geocore   # файл, не симлинк
#   sudo nginx -t && sudo systemctl reload nginx
#
# СНАЧАЛА выпустить сертификат (один на все поддомены):
#   sudo certbot certonly --nginx \
#     -d geocore-academy.kz -d courses.geocore-academy.kz \
#     -d api.geocore-academy.kz -d usn.geocore-academy.kz -d usn-api.geocore-academy.kz
#   → сохранится в /etc/letsencrypt/live/geocore-academy.kz/ (первый -d = имя папки)
#
# Для демо можно поднять только frontend + Moodle + api и закомментировать usn-блоки.

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name geocore-academy.kz courses.geocore-academy.kz api.geocore-academy.kz usn.geocore-academy.kz usn-api.geocore-academy.kz;
    return 301 https://$host$request_uri;
}

# Frontend (главный домен)
server {
    listen 443 ssl http2;
    server_name geocore-academy.kz;

    ssl_certificate     /etc/letsencrypt/live/geocore-academy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocore-academy.kz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Moodle LMS
server {
    listen 443 ssl http2;
    server_name courses.geocore-academy.kz;

    ssl_certificate     /etc/letsencrypt/live/geocore-academy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocore-academy.kz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    # Электронные курсы (CourseLab HTML) — отдаются напрямую с диска
    location /content/ {
        alias /opt/geocore/courses/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# Python / FastAPI Backend
server {
    listen 443 ssl http2;
    server_name api.geocore-academy.kz;

    ssl_certificate     /etc/letsencrypt/live/geocore-academy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocore-academy.kz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# USN-app frontend  (на демо можно закомментировать весь блок)
server {
    listen 443 ssl http2;
    server_name usn.geocore-academy.kz;

    ssl_certificate     /etc/letsencrypt/live/geocore-academy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocore-academy.kz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Базовая HTTP-авторизация — только для владельца
    auth_basic           "USN App";
    auth_basic_user_file /etc/nginx/.htpasswd_usn;

    location /api/ {
        auth_basic         off;
        proxy_pass         http://127.0.0.1:3001/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        include            /etc/nginx/usn_api_key.conf;
    }

    location /health {
        proxy_pass         http://127.0.0.1:3001/health;
        proxy_set_header   Host              $host;
        auth_basic         off;
    }

    location / {
        proxy_pass       http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# USN-app backend API  (на демо можно закомментировать весь блок)
server {
    listen 443 ssl http2;
    server_name usn-api.geocore-academy.kz;

    ssl_certificate     /etc/letsencrypt/live/geocore-academy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocore-academy.kz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
