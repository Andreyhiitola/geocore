# GeoCore-Academy — nginx для KZ-ДЕМО (geocore-academy.kz)
# Урезанная версия geocore-kz.conf: только frontend + Moodle + api.
# usn-блоки убраны (на демо usn не поднимаем; они требуют .htpasswd_usn / usn_api_key.conf).
# Cert: /etc/letsencrypt/live/geocore-academy.kz/ (выпущен на @, www, courses, api).

# HTTP → HTTPS
server {
    listen 80;
    server_name geocore-academy.kz www.geocore-academy.kz courses.geocore-academy.kz api.geocore-academy.kz;
    return 301 https://$host$request_uri;
}

# Frontend (главный домен + www)
server {
    listen 443 ssl http2;
    server_name geocore-academy.kz www.geocore-academy.kz;

    ssl_certificate     /etc/letsencrypt/live/geocore-academy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocore-academy.kz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Moodle LMS
server {
    listen 443 ssl http2;
    server_name courses.geocore-academy.kz;

    ssl_certificate     /etc/letsencrypt/live/geocore-academy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocore-academy.kz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    # CourseLab HTML-курсы с диска (если каталог есть; иначе просто 404)
    location /content/ {
        alias /opt/geocore/courses/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# Backend API
server {
    listen 443 ssl http2;
    server_name api.geocore-academy.kz;

    ssl_certificate     /etc/letsencrypt/live/geocore-academy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocore-academy.kz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
