# Test / local — собирает образы локально (не тянет с Docker Hub)
# Использует для проверки новой версии Moodle перед деплоем в прод
# Запуск: docker compose -f docker-compose.test.yml up --build
# Moodle доступен на: http://localhost:8081
# Backend доступен на: http://localhost:8001
#
# Чтобы протестировать другую версию Moodle:
#   MOODLE_TEST_VERSION=5.1.3 docker compose -f docker-compose.test.yml up --build

services:
  mariadb-test:
    image: mariadb:10.11
    container_name: geocore_db_test
    restart: unless-stopped
    volumes:
      - mariadb_test_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: testroot
      MYSQL_DATABASE: moodle_test
      MYSQL_USER: moodle
      MYSQL_PASSWORD: testpass
    networks:
      - test_net

  moodle-test:
    build:
      context: ./moodle
      args:
        MOODLE_VERSION: ${MOODLE_TEST_VERSION:-5.1.3}
    container_name: geocore_moodle_test
    restart: unless-stopped
    depends_on:
      - mariadb-test
    ports:
      - "8082:80"
    volumes:
      - moodle_test_data:/var/moodledata
    environment:
      MOODLE_DB_HOST: mariadb-test
      MOODLE_DB_NAME: moodle_test
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: testpass
      MOODLE_WWWROOT: http://localhost:8082
      MOODLE_SITE_NAME: Geocore-Academy
      MOODLE_SITE_SHORTNAME: geocore-test
      MOODLE_LANG: ru
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASS: Admin1234!
      MOODLE_ADMIN_EMAIL: admin@geocore-test.local
    networks:
      - test_net

  backend-test:
    build: ./backend
    container_name: geocore_api_test
    restart: unless-stopped
    ports:
      - "8001:8000"
    networks:
      - test_net

networks:
  test_net:
    driver: bridge

volumes:
  mariadb_test_data:
  moodle_test_data:
