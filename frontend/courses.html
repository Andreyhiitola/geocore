<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Все курсы — GeoCore Academy</title>
<meta name="description" content="Полный каталог курсов по геологии и горному делу: Leapfrog, Datamine, Surpac, геостатистика. SCORM-курсы доступны прямо сейчас.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#C9A84C; --gold-light:#E8C97A; --gold-dim:#7A6230;
  --dark:#0A0A0B; --dark-2:#111114; --dark-3:#18181D; --dark-4:#1F1F26;
  --surface:#252530; --text:#E8E6DE; --text-muted:#9A9890; --text-dim:#5C5B56;
  --border:rgba(201,168,76,0.18); --border-dim:rgba(255,255,255,0.07);
}
body.light{
  --dark:#F5F3EE; --dark-2:#EDE9E0; --dark-3:#E4DED2; --dark-4:#D9D2C5;
  --surface:#FFFFFF; --text:#1A1916; --text-muted:#5A5650; --text-dim:#9A9080;
  --border:rgba(139,105,27,0.2); --border-dim:rgba(0,0,0,0.06);
}
html{scroll-behavior:smooth;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--dark);color:var(--text);transition:background .3s,color .3s;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.35;}
body.light::before{display:none;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:68px;background:rgba(10,10,11,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
body.light nav{background:rgba(245,243,238,.92);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-hex{width:32px;height:32px;background:var(--gold);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);}
.logo-text{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--text);}
.logo-text span{color:var(--gold);}
.nav-links{display:flex;gap:36px;list-style:none;}
.nav-links a{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;transition:color .2s;}
.nav-links a:hover{color:var(--gold);}
.nav-right{display:flex;align-items:center;gap:12px;}
.theme-btn{background:none;border:1px solid var(--border);color:var(--text-muted);width:34px;height:34px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.theme-btn:hover{border-color:var(--gold);color:var(--gold);}
.nav-cta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dark);background:var(--gold);padding:9px 22px;text-decoration:none;clip-path:polygon(7px 0%,100% 0%,calc(100% - 7px) 100%,0% 100%);}
.nav-cta:hover{background:var(--gold-light);}
.nav-back{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;display:flex;align-items:center;gap:8px;}
.nav-back:hover{color:var(--gold);}

/* PAGE */
.courses-page{max-width:1240px;margin:0 auto;padding:120px 100px 80px;}
.page-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.page-eyebrow::before{content:'';width:32px;height:1px;background:var(--gold);}
h1.page-title{font-family:'Playfair Display',serif;font-size:clamp(40px,4vw,56px);font-weight:900;line-height:1.1;margin-bottom:20px;}
.page-desc{font-size:16px;font-weight:300;line-height:1.75;color:var(--text-muted);max-width:680px;margin-bottom:32px;}

/* FILTERS */
.filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:48px;padding-bottom:24px;border-bottom:1px solid var(--border-dim);}
.filter-btn{background:transparent;border:1px solid var(--border-dim);color:var(--text-muted);padding:8px 20px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;cursor:pointer;transition:all .2s;}
.filter-btn:hover{border-color:var(--gold);color:var(--gold);}
.filter-btn.active{background:var(--gold);border-color:var(--gold);color:var(--dark);}

/* COURSES GRID */
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
.cg-more{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:36px;}
.cg-more-count{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;}
.cg-more-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.cg-more-btn{background:none;border:1px solid var(--border-dim);color:var(--text-muted);padding:9px 20px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.cg-more-btn:hover{border-color:var(--gold);color:var(--gold);}
.cg-more-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.08);}

.cc{background:var(--dark-3);padding:36px 32px;position:relative;overflow:hidden;transition:all .3s;border:1px solid transparent;cursor:pointer;}
.cc::before{content:'';position:absolute;top:0;left:0;width:3px;height:0;background:var(--gold);transition:height .4s ease;}
.cc:hover{background:var(--dark-4);border-color:var(--border);transform:translateY(-4px);}
.cc:hover::before{height:100%;}
.cc-num{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--text-dim);margin-bottom:18px;}
.cc-icon{font-size:30px;margin-bottom:16px;display:block;}
.cc-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);padding:3px 7px;margin-bottom:14px;}
h3.cc-t{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;line-height:1.25;margin-bottom:10px;}
.cc-d{font-size:13px;font-weight:300;line-height:1.6;color:var(--text-muted);margin-bottom:24px;}
.cc-meta{display:flex;gap:18px;padding-top:20px;border-top:1px solid var(--border-dim);}
.cc-m{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.07em;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
.cc-live{cursor:pointer;}
.cc-live::after{content:'ОТКРЫТ';position:absolute;top:18px;right:18px;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.14em;color:var(--dark);background:var(--gold);padding:3px 9px;clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);}
.cc-soon{opacity:.45;cursor:default;border:1px dashed rgba(255,255,255,0.06) !important;}
.cc-soon::after{content:'СКОРО';position:absolute;top:18px;right:18px;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.14em;color:var(--text-dim);background:var(--dark-2);border:1px solid var(--border-dim);padding:3px 9px;clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);}
.cc-soon:hover{background:var(--dark-3);transform:none;}
.cc-soon:hover::before{height:0;}
.cc-planned{opacity:.7;cursor:pointer;border:1px dashed rgba(255,255,255,0.08) !important;}
.cc-planned::after{content:'ПРЕДЗАПИСЬ';position:absolute;top:18px;right:18px;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.10em;color:var(--gold);background:var(--dark-2);padding:3px 9px;clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);}
.cc-planned:hover{background:var(--dark-3);transform:none;}
.cc-planned:hover::before{height:0;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;}
.modal-overlay.open{opacity:1;visibility:visible;}
.modal-panel{background:var(--dark-4);border:1px solid var(--border);max-width:620px;width:90%;max-height:88vh;overflow-y:auto;padding:52px 48px 48px;position:relative;transform:translateY(16px);transition:transform .3s;}
.modal-overlay.open .modal-panel{transform:translateY(0);}
.modal-panel::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--gold);}
.modal-close{position:absolute;top:20px;right:20px;background:none;border:1px solid var(--border-dim);color:var(--text-dim);width:34px;height:34px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:'IBM Plex Mono',monospace;}
.modal-close:hover{border-color:var(--gold);color:var(--gold);}
.modal-tag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);padding:3px 7px;display:inline-block;margin-bottom:20px;}
.modal-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;line-height:1.2;margin-bottom:12px;}
.modal-tagline{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--gold-light);margin-bottom:20px;line-height:1.5;}
.modal-desc{font-size:13.5px;font-weight:300;line-height:1.75;color:var(--text-muted);margin-bottom:32px;}
.modal-section{margin-bottom:32px;}
.modal-section-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;color:var(--text-dim);margin-bottom:14px;}
.modal-highlights{list-style:none;display:flex;flex-direction:column;gap:10px;}
.modal-hi{font-size:13px;font-weight:300;line-height:1.5;color:var(--text);padding-left:20px;position:relative;}
.modal-hi::before{content:'◆';position:absolute;left:0;color:var(--gold);font-size:7px;top:4px;}
.modal-meta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px 0;border-top:1px solid var(--border-dim);border-bottom:1px solid var(--border-dim);margin-bottom:28px;}
.modal-meta-label{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.14em;color:var(--text-dim);margin-bottom:6px;}
.modal-meta-val{font-size:12.5px;font-weight:400;color:var(--text);line-height:1.4;}
.modal-cta{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dark);background:var(--gold);padding:14px 32px;text-decoration:none;clip-path:polygon(7px 0%,100% 0%,calc(100% - 7px) 100%,0% 100%);transition:background .2s;margin-top:8px;}
.modal-cta:hover{background:var(--gold-light);}
.req-form label{display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;margin-top:18px;}
.req-form input,.req-form textarea,.req-form select{width:100%;background:var(--dark-3);border:1px solid var(--border-dim);color:var(--text);padding:10px 14px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s;resize:vertical;}
.req-form input:focus,.req-form textarea:focus,.req-form select:focus{border-color:var(--gold);}
.req-form input::placeholder,.req-form textarea::placeholder{color:var(--text-dim);}
.req-form-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}
.req-form-cancel{background:none;border:1px solid var(--border-dim);color:var(--text-muted);padding:10px 22px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;cursor:pointer;transition:all .2s;}
.req-form-cancel:hover{border-color:var(--gold);color:var(--gold);}
.req-status{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;}
.modal-soon-note{display:flex;align-items:flex-start;gap:16px;padding:20px 24px;background:var(--dark-3);border:1px solid var(--border-dim);margin-top:8px;}
.modal-soon-icon{font-size:22px;flex-shrink:0;}
.modal-soon-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;color:var(--text-dim);margin-bottom:6px;}
.modal-soon-text{font-size:13px;font-weight:300;color:var(--text-muted);line-height:1.5;}

/* FOOTER */
footer{background:var(--dark-2);border-top:1px solid var(--border-dim);padding:56px 0 36px;margin-top:80px;}
.fi{max-width:1240px;margin:0 auto;padding:0 100px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:56px;margin-bottom:44px;}
.fb-d{font-size:13px;font-weight:300;line-height:1.75;color:var(--text-muted);margin-top:14px;max-width:240px;}
.fc-t{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:18px;}
.fl{list-style:none;display:flex;flex-direction:column;gap:9px;}
.fl a{font-size:13px;font-weight:300;color:var(--text-muted);text-decoration:none;transition:color .2s;}
.fl a:hover{color:var(--gold);}
.fb{max-width:1240px;margin:0 auto;padding:22px 100px 0;border-top:1px solid var(--border-dim);display:flex;justify-content:space-between;align-items:center;}
.fc{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.07em;color:var(--text-dim);}

.nav-burger{display:none;background:none;border:1px solid var(--border);color:var(--text-muted);width:36px;height:36px;font-size:16px;cursor:pointer;align-items:center;justify-content:center;transition:all .2s;}
.nav-burger:hover{border-color:var(--gold);color:var(--gold);}
.nav-mobile{display:none;position:fixed;top:68px;left:0;right:0;background:rgba(10,10,11,.97);backdrop-filter:blur(20px);z-index:190;flex-direction:column;padding:24px 24px 32px;border-bottom:1px solid var(--border);gap:0;}
.nav-mobile.open{display:flex;}
body.light .nav-mobile{background:rgba(245,243,238,.97);}
.nav-mobile a{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;padding:14px 0;border-bottom:1px solid var(--border-dim);transition:color .2s;}
.nav-mobile a:hover{color:var(--gold);}
.nav-mobile-cta{color:var(--gold) !important;border-bottom:none !important;margin-top:8px;}

@media(max-width:1080px){
  nav{padding:0 24px;}.nav-links{display:none;}.nav-burger{display:flex;}
  .courses-page{padding:100px 24px 60px;}
  .cg{grid-template-columns:1fr;}
  .fi,.fb{padding-left:24px;padding-right:24px;}
  .fi{grid-template-columns:1fr 1fr;}
}
@media(max-width:640px){
  .nav-cta{display:none;}
  .courses-page{padding:88px 16px 48px;}
  h1.page-title{font-size:32px;}
  .filters{gap:8px;}
  .filter-btn{padding:6px 14px;font-size:9px;}
  .modal-panel{padding:40px 20px 32px;width:95%;}
  .modal-meta-row{grid-template-columns:1fr;}
  .req-form-btns{flex-direction:column;}
  .req-form-btns button{width:100%;}
  .fi{grid-template-columns:1fr;}
  .fb{flex-direction:column;gap:12px;text-align:center;}
}
</style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center;gap:24px;">
    <a href="index.html" class="nav-logo">
      <div class="logo-hex"></div>
      <span class="logo-text">Geo<span>Core</span>-Academy</span>
    </a>
    <a href="index.html" class="nav-back">← На главную</a>
  </div>
  <ul class="nav-links"></ul>
  <div class="nav-right">
    <button class="theme-btn" id="themeBtn" title="Сменить тему">🌙</button>
    <a href="index.html#pricing" class="nav-cta">Начать обучение</a>
    <button class="nav-burger" id="navBurger" aria-label="Меню">☰</button>
  </div>
</nav>
<div class="nav-mobile" id="navMobile">
  <a href="index.html">Главная</a>
  <a href="index.html#courses">Курсы</a>
  <a href="lab.html">Лаборатория</a>
  <a href="index.html#pricing" class="nav-mobile-cta">Начать обучение</a>
</div>

<main class="courses-page">
  <div class="page-eyebrow">Полный каталог</div>
  <h1 class="page-title">Все курсы GeoCore Academy</h1>
  <p class="page-desc">Профессиональные курсы для геологов, маркшейдеров и горных инженеров. SCORM-курсы доступны прямо сейчас.</p>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">Все курсы</button>
    <button class="filter-btn" data-filter="live">Открыт</button>
    <button class="filter-btn" data-filter="soon">Скоро</button>
    <button class="filter-btn" data-filter="planned">В разработке</button>
  </div>

  <div class="cg"></div>
</main>

<footer>
  <div class="fi"></div>
  <div class="fb">
    <div class="fc"></div>
  </div>
</footer>

<script>
const themeBtn = document.getElementById('themeBtn');
let dark = !localStorage.getItem('geocoreLight');
function applyTheme() {
  document.body.classList.toggle('light', !dark);
  if (themeBtn) themeBtn.textContent = dark ? '🌙' : '☀️';
}
applyTheme();
themeBtn?.addEventListener('click', () => {
  dark = !dark;
  localStorage.setItem('geocoreLight', dark ? '' : '1');
  applyTheme();
});

const burger = document.getElementById('navBurger');
const mobileNav = document.getElementById('navMobile');
burger?.addEventListener('click', () => {
  mobileNav.classList.toggle('open');
  burger.textContent = mobileNav.classList.contains('open') ? '✕' : '☰';
});
mobileNav?.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    mobileNav.classList.remove('open');
    burger.textContent = '☰';
  });
});
</script>

<script type="module">
import { initSite } from '/js/data/siteRenderer.js';

await initSite();

// Фильтры по статусу карточки
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.cg .cc').forEach(card => {
      const show = f === 'all'
        || (f === 'live'    && card.classList.contains('cc-live'))
        || (f === 'soon'    && card.classList.contains('cc-soon'))
        || (f === 'planned' && card.classList.contains('cc-planned'));
      card.style.display = show ? '' : 'none';
    });
  });
});
</script>

</body>
</html>
